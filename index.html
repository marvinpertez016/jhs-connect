<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b68">
<title>JHS Connect — School Portal</title>
<style>
:root{--navy:#173b68;--blue:#2c64a3;--ink:#17253b;--muted:#66758b;--line:#e3e9f1;--bg:#f4f7fb;--white:#fff;--green:#17845d;--amber:#a96808;--red:#b43d48}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#102b4d;color:#e9f1fb;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.brandmark{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:17px;margin:0}.brand small{color:#b8c9de}.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#9db3ce;padding:0 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d9e5f3;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#24486f;color:white}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #315070;padding:16px 8px;color:#b8c9de;font-size:12px}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:12px}.role-select{border:1px solid var(--line);border-radius:9px;padding:9px;background:white;color:var(--ink)}.avatar{width:36px;height:36px;border-radius:50%;background:#dce9f8;color:var(--navy);display:grid;place-items:center;font-weight:800}.content{max-width:1400px;margin:auto;padding:28px 30px 50px}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.welcome h2{font-size:28px;letter-spacing:-.7px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--ink);font-weight:650}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn:focus,input:focus,select:focus{outline:3px solid #bcd8f8;outline-offset:1px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 7px #152f4d05}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.staticon{width:36px;height:36px;border-radius:10px;background:#eef4fc;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:27px;margin-top:12px;letter-spacing:-.5px}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px}.panel{padding:20px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.panel h3{font-size:16px;margin:0}.panel p.sub{font-size:13px;color:var(--muted);margin:4px 0 0}.list{display:grid;gap:0}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f6}.item:last-child{border-bottom:0}.doticon{flex:0 0 36px;height:36px;border-radius:10px;background:#eff5fc;display:grid;place-items:center}.itemmain{min-width:0;flex:1}.itemmain strong{display:block;font-size:14px}.itemmain small{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:750;background:#edf2f8;color:#53647a;white-space:nowrap}.tag.green{background:#e2f5ec;color:#16724f}.tag.amber{background:#fff2d8;color:#946009}.tag.red{background:#fde8e9;color:#a52f3a}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:11px;text-align:left;padding:14px;display:grid;gap:8px}.quick button:hover{border-color:#9cbbe1;background:#f8fbff}.quick span{font-size:21px}.quick strong{font-size:13px}.quick small{color:var(--muted);font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:var(--muted);font-weight:650;background:#fafbfd}td strong{font-size:13px}.searchrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.searchrow input,.searchrow select,.field input,.field select,.field textarea{border:1px solid #d8e1ec;border-radius:9px;padding:10px 12px;background:white;color:var(--ink)}.searchrow input{flex:1;min-width:190px}.pillbtn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;font-size:12px}.pillbtn.present{background:#e2f5ec;color:#16724f;border-color:#bde8d4}.pillbtn.absent{background:#fde8e9;color:#a52f3a;border-color:#f3c5c8}.notice{background:#eef5fd;border:1px solid #d6e6f8;color:#315477;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px}.empty{color:var(--muted);padding:25px;text-align:center}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.hide{display:none!important}.footer-note{color:var(--muted);font-size:12px;margin-top:20px}.mobilehead{display:none}
@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.content{padding:24px 20px}.topbar{padding:0 20px}}
@media(max-width:700px){.shell{display:block}.sidebar{display:none}.mobilehead{display:flex;align-items:center;gap:10px;background:#102b4d;color:white;padding:12px 16px}.mobilehead strong{font-size:15px}.mobilehead select{margin-left:auto;max-width:155px}.topbar{height:58px;padding:0 16px}.topbar .crumb{display:none}.content{padding:20px 14px 35px}.welcome{display:block}.welcome h2{font-size:24px}.welcome .btn{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.stathead{font-size:11px}.staticon{width:30px;height:30px}.panel{padding:15px}.quick{gap:8px}.formgrid{grid-template-columns:1fr}.topright .role-select{display:none}}
</style>
</head>
<body>
<div class="mobilehead"><div class="brandmark">J</div><strong>JHS Connect</strong><select id="mobileRole" class="role-select" aria-label="Preview role"><option>Admin</option><option>Teacher</option><option>Student</option><option>Principal</option></select></div>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">J</div><div><h1>JHS Connect</h1><small>School portal & LMS</small></div></div>
  <div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="students"><span class="ico">♙</span>Students</button>
    <button data-page="classes"><span class="ico">▤</span>Classes & Subjects</button>
    <button data-page="attendance"><span class="ico">✓</span>Attendance</button>
    <button data-page="assignments"><span class="ico">✎</span>Assignments</button>
    <button data-page="grades"><span class="ico">▥</span>Grades</button>
    <button data-page="announcements"><span class="ico">◉</span>Announcements</button>
    <button data-page="reports"><span class="ico">▧</span>Reports</button>
  </nav></div>
  <div class="sidefoot">DEMO ENVIRONMENT<br>Sample records only · No real student data</div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">School Portal / <strong id="crumbPage">Dashboard</strong></div><div class="topright"><span class="crumb">Preview as</span><select id="role" class="role-select" aria-label="Preview role"><option>Admin</option><option>Teacher</option><option>Student</option><option>Principal</option></select><div class="avatar" id="avatar">AD</div></div></header>
<div class="content" id="content"></div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dvkeazgbapnmprnzntet.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_F9YoJUqTcHVxOIdTG-SbQw_JMzL_o7u";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

console.log("JHS Connect Supabase client initialized.");

const students=[
{id:"JHS-2026-001",name:"Alyssa Reyes",grade:"Grade 7",section:"Mabini",attendance:"Present",math:91,english:88},
{id:"JHS-2026-001",name:"Alyssa Reyes",grade:"Grade 7",section:"Mabini",attendance:"Present",math:91,english:88},
{id:"JHS-2026-002",name:"Joshua Santos",grade:"Grade 7",section:"Mabini",attendance:"Present",math:84,english:90},
{id:"JHS-2026-003",name:"Mikaela Cruz",grade:"Grade 8",section:"Rizal",attendance:"Absent",math:87,english:92},
{id:"JHS-2026-004",name:"Daniel Garcia",grade:"Grade 8",section:"Rizal",attendance:"Present",math:79,english:85},
{id:"JHS-2026-005",name:"Sophia Mendoza",grade:"Grade 9",section:"Bonifacio",attendance:"Present",math:94,english:93},
{id:"JHS-2026-006",name:"Gabriel Flores",grade:"Grade 9",section:"Bonifacio",attendance:"Late",math:82,english:86},
{id:"JHS-2026-007",name:"Isabella Torres",grade:"Grade 10",section:"Del Pilar",attendance:"Present",math:96,english:95},
{id:"JHS-2026-008",name:"Ethan Villanueva",grade:"Grade 10",section:"Del Pilar",attendance:"Present",math:88,english:89}
];
let currentPage="dashboard", role="Admin", searchTerm="", assignmentList=[
{title:"Algebra Practice: Linear Equations",subject:"Mathematics",due:"Oct 20, 2026",status:"Open"},
{title:"Reading Response: Short Story",subject:"English",due:"Oct 22, 2026",status:"Open"},
{title:"Ecosystems Infographic",subject:"Science",due:"Oct 24, 2026",status:"Draft"}
], announcements=[
{title:"Quarter 2 learning materials are available",by:"School Administration",date:"Oct 16, 2026"},
{title:"Parent-teacher conference schedule",by:"Office of the Principal",date:"Oct 15, 2026"},
{title:"Science project submission reminders",by:"Science Department",date:"Oct 14, 2026"}
];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function canAdmin(){return role==="Admin"||role==="Principal"}
function setPage(p){currentPage=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
$("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});
function setRole(v){role=v;$("role").value=v;$("mobileRole").value=v;$("avatar").textContent=({Admin:"AD",Teacher:"TE",Student:"ST",Principal:"PR"})[v];render()}
$("role").addEventListener("change",e=>setRole(e.target.value));$("mobileRole").addEventListener("change",e=>setRole(e.target.value));
function stat(label,value,sub,icon){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="staticon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function panelHead(title,sub="",action=""){return `<div class="panelhead"><div><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:""}</div>${action}</div>`}
function assignmentItems(){return assignmentList.map((a,i)=>`<div class="item"><div class="doticon">✎</div><div class="itemmain"><strong>${esc(a.title)}</strong><small>${esc(a.subject)} · Due ${esc(a.due)}</small></div><span class="tag ${a.status==="Open"?"green":""}">${esc(a.status)}</span></div>`).join("")}
function announcementItems(){return announcements.map(a=>`<div class="item"><div class="doticon">◉</div><div class="itemmain"><strong>${esc(a.title)}</strong><small>${esc(a.by)} · ${esc(a.date)}</small></div></div>`).join("")}
function dashboard(){let isStudent=role==="Student",isTeacher=role==="Teacher",isPrincipal=role==="Principal";
let title=isStudent?"Welcome back, Student":isTeacher?"Teacher Dashboard":isPrincipal?"Principal's Overview":"School Overview";
let subtitle=isStudent?"Here is your learning activity at a glance.":isTeacher?"Manage your classes, attendance, and learning activities.":isPrincipal?"Review school-wide performance and activity.":"Manage school records, learning, and daily operations.";
return `<div class="welcome"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="btn primary" onclick="setPage('${isStudent?"assignments":isTeacher?"attendance":"students"}')">${isStudent?"View assignments":isTeacher?"Take attendance":"Open school records"} →</button></div>
<div class="notice">👋 <strong>Welcome to JHS Connect.</strong> This is a working interface prototype with sample data. Login, cloud sync, and production security are not connected yet.</div>
<div class="stats">${stat(isStudent?"My subjects":"Students",isStudent?"8":"1,248",isStudent?"Across this school year":"Sample school total","♙")}${stat(isStudent?"Assignments due":"Attendance today",isStudent?"3":"96.8%",isStudent?"Across your subjects":"Sample daily attendance","✓")}${stat(isStudent?"Current average":"Active sections",isStudent?"89.4":"32",isStudent?"Illustrative average":"Across Grades 7–10","▤")}${stat(isStudent?"Upcoming quizzes":"Teachers",isStudent?"2":"68",isStudent?"Next 7 days":"Sample school total","✎")}</div>
<div class="grid"><section class="panel">${panelHead(isStudent?"My assignments":"Recent assignments","Latest learning activities",`<button class="btn" onclick="setPage('assignments')">View all</button>`)}<div class="list">${assignmentItems()}</div></section>
<section class="panel">${panelHead("Quick actions","Common tasks")}<div class="quick">
<button onclick="setPage('students')"><span>♙</span><strong>${isStudent?"My profile":"Student records"}</strong><small>Find student details</small></button>
<button onclick="setPage('attendance')"><span>✓</span><strong>Attendance</strong><small>Daily class records</small></button>
<button onclick="setPage('grades')"><span>▥</span><strong>Gradebook</strong><small>Review grades</small></button>
<button onclick="setPage('announcements')"><span>◉</span><strong>Announcements</strong><small>School updates</small></button>
</div></section></div>
<div class="panel" style="margin-top:18px">${panelHead("School announcements","Latest notices",`<button class="btn" onclick="setPage('announcements')">View all</button>`)}<div class="list">${announcementItems()}</div></div>
<div class="footer-note">Demo figures are illustrative and should not be used for actual school reporting.</div>`}
function studentsPage(){let list=students.filter(s=>(s.name+" "+s.id+" "+s.grade+" "+s.section).toLowerCase().includes(searchTerm.toLowerCase()));return `<div class="welcome"><div><h2>Student Directory</h2><p>Search sample student records by name, student ID, grade, or section.</p></div>${canAdmin()?'<button class="btn primary" onclick="alert(&quot;In the production version, this opens a secure student enrollment form.&quot;)">＋ Add student</button>':""}</div><div class="panel">${panelHead("Student records",`${list.length} matching sample records`)}<div class="searchrow"><input id="studentSearch" value="${esc(searchTerm)}" placeholder="Search name, ID, grade, or section…" aria-label="Search students"><select id="gradeFilter" aria-label="Filter grade"><option value="">All grade levels</option>${["Grade 7","Grade 8","Grade 9","Grade 10"].map(g=>`<option>${g}</option>`).join("")}</select></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Grade & Section</th><th>Attendance</th><th>Action</th></tr></thead><tbody>${list.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.id)}</td><td>${esc(s.grade)} · ${esc(s.section)}</td><td><span class="tag ${s.attendance==="Present"?"green":s.attendance==="Absent"?"red":"amber"}">${s.attendance}</span></td><td><button class="pillbtn" onclick="alert('Sample record: ${esc(s.name)}\\n${esc(s.id)}\\n${esc(s.grade)} - ${esc(s.section)}')">View</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No matching students found.</td></tr>'}</tbody></table></div></div><p class="footer-note">Only fictional sample records are included. Production records should be available only to authorized users.</p>`}
function classesPage(){let classes=[["Grade 7 · Mabini","Mathematics","Ms. Ana Dela Cruz","38"],["Grade 7 · Mabini","English","Mr. Paulo Lim","38"],["Grade 8 · Rizal","Science","Ms. Carla Reyes","36"],["Grade 9 · Bonifacio","Araling Panlipunan","Mr. Miguel Santos","40"],["Grade 10 · Del Pilar","Filipino","Ms. Liza Ramos","37"]];return `<div class="welcome"><div><h2>Classes & Subjects</h2><p>Organize grade levels, sections, subjects, and assigned teachers.</p></div></div><div class="panel">${panelHead("Class list","Sample class assignments")}<div class="tablewrap"><table><thead><tr><th>Section</th><th>Subject</th><th>Teacher</th><th>Students</th></tr></thead><tbody>${classes.map(c=>`<tr>${c.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function attendancePage(){return `<div class="welcome"><div><h2>Attendance</h2><p>Mark sample attendance for today's class. Changes remain in this browser session only.</p></div><button class="btn primary" onclick="alert('In production, attendance is saved to the school database with an audit trail.')">Save attendance</button></div><div class="panel">${panelHead("Grade 8 · Rizal","Sample attendance sheet · October 17, 2026")}<div class="tablewrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Attendance status</th></tr></thead><tbody>${students.filter(s=>s.grade==="Grade 8").map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.id)}</td><td><button class="pillbtn ${s.attendance==="Present"?"present":s.attendance==="Absent"?"absent":""}" onclick="cycleAttendance('${s.id}')">${s.attendance} ↻</button></td></tr>`).join("")}</tbody></table></div></div><p class="footer-note">For real deployment, attendance edits should be restricted to assigned teachers and authorized administrators.</p>`}
function cycleAttendance(id){let s=students.find(x=>x.id===id);s.attendance=s.attendance==="Present"?"Absent":s.attendance==="Absent"?"Late":"Present";render()}
function assignmentsPage(){return `<div class="welcome"><div><h2>Assignments & Learning</h2><p>Manage learning activities, due dates, and submission workflow.</p></div>${role!=="Student"?'<button class="btn primary" onclick="showAssignmentForm()">＋ Create assignment</button>':""}</div><div class="panel">${panelHead(role==="Student"?"Assignments for my classes":"Learning activities","Sample assignment list")}<div class="list">${assignmentItems()}</div></div><div class="panel hide" id="assignmentForm" style="margin-top:18px">${panelHead("Create an assignment","Prototype form")}<div class="formgrid"><div class="field"><label for="aTitle">Assignment title</label><input id="aTitle" placeholder="e.g. Fractions worksheet"></div><div class="field"><label for="aSubject">Subject</label><select id="aSubject"><option>Mathematics</option><option>English</option><option>Science</option><option>Filipino</option><option>Araling Panlipunan</option></select></div><div class="field"><label for="aDue">Due date</label><input id="aDue" type="date"></div><div class="field"><label for="aStatus">Status</label><select id="aStatus"><option>Draft</option><option>Open</option></select></div></div><button class="btn primary" onclick="addAssignment()">Add to demo list</button></div><p class="footer-note">File uploads, student submissions, automated grading, and notifications are planned for the connected version.</p>`}
function showAssignmentForm(){$("assignmentForm").classList.toggle("hide")}
function addAssignment(){let title=$("aTitle").value.trim();if(!title){alert("Please enter an assignment title.");return}assignmentList.unshift({title,subject:$("aSubject").value,due:$("aDue").value||"Not set",status:$("aStatus").value});render()}
function gradesPage(){return `<div class="welcome"><div><h2>Gradebook</h2><p>Illustrative grades for selected subjects. Official grading rules are configurable.</p></div><button class="btn" onclick="alert('PDF/XLSX export will be connected in a later version.')">Export report</button></div><div class="panel">${panelHead("Sample grade summary","Term 1 · Mathematics and English")}<div class="tablewrap"><table><thead><tr><th>Student</th><th>Grade & Section</th><th>Mathematics</th><th>English</th><th>Average</th></tr></thead><tbody>${students.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.grade)} · ${esc(s.section)}</td><td>${s.math}</td><td>${s.english}</td><td><span class="tag ${((s.math+s.english)/2)>=90?"green":""}">${((s.math+s.english)/2).toFixed(1)}</span></td></tr>`).join("")}</tbody></table></div></div><p class="footer-note">These sample scores are fictional. Official report cards require approved grading components, validation, and authorized sign-off.</p>`}
function announcementsPage(){return `<div class="welcome"><div><h2>Announcements</h2><p>Share important updates with the school community.</p></div>${canAdmin()||role==="Teacher"?'<button class="btn primary" onclick="showAnnouncementForm()">＋ New announcement</button>':""}</div><div class="panel">${panelHead("School notices","Most recent first")}<div class="list">${announcementItems()}</div></div><div class="panel hide" id="announcementForm" style="margin-top:18px">${panelHead("New announcement","Demo form")}<div class="field"><label for="nTitle">Title</label><input id="nTitle" placeholder="Announcement title"></div><div class="field"><label for="nBody">Message</label><textarea id="nBody" placeholder="Write your message"></textarea></div><button class="btn primary" onclick="addAnnouncement()">Publish to demo list</button></div>`}
function showAnnouncementForm(){$("announcementForm").classList.toggle("hide")}
function addAnnouncement(){let title=$("nTitle").value.trim(),body=$("nBody").value.trim();if(!title){alert("Please enter an announcement title.");return}announcements.unshift({title,by:role,date:"Today"});if(body)announcements[0].title += " — "+body;render()}
function reportsPage(){return `<div class="welcome"><div><h2>Reports & Insights</h2><p>School-wide indicators for leadership review.</p></div></div><div class="stats">${stat("Enrollment","1,248","Illustrative total","♙")}${stat("Attendance","96.8%","Illustrative daily rate","✓")}${stat("Sections","32","Across Grades 7–10","▤")}${stat("Teachers","68","Illustrative staff count","✎")}</div><div class="panel">${panelHead("Planned reports","Available in the production version")}<div class="list">${["Enrollment by grade level and section","Daily and monthly attendance summary","Quarterly grade distribution","Missing assignments and assessment completion","Student intervention and performance summary"].map(x=>`<div class="item"><div class="doticon">▧</div><div class="itemmain"><strong>${x}</strong><small>Filter by school year, quarter, grade, and section</small></div><span class="tag">Planned</span></div>`).join("")}</div></div>`}
function render(){let pages={dashboard,students:studentsPage,classes:classesPage,attendance:attendancePage,assignments:assignmentsPage,grades:gradesPage,announcements:announcementsPage,reports:reportsPage};$("crumbPage").textContent=({dashboard:"Dashboard",students:"Students",classes:"Classes & Subjects",attendance:"Attendance",assignments:"Assignments",grades:"Grades",announcements:"Announcements",reports:"Reports"})[currentPage];$("content").innerHTML=pages[currentPage]();if(currentPage==="students"){$("studentSearch").addEventListener("input",e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;render();$("studentSearch").focus();$("studentSearch").setSelectionRange(pos,pos)});$("gradeFilter").addEventListener("change",e=>{let g=e.target.value;searchTerm=g; $("studentSearch").value=g; $("studentSearch").dispatchEvent(new Event("input"))})}}
render();
</script>
</body>
</html>
